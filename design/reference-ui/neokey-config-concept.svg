<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1240" viewBox="0 0 760 1240" role="img" aria-labelledby="title desc">
  <title id="title">Giao diện cấu hình Neokey 0.1.10</title>
  <desc id="desc">Giao diện tối của Neokey với kiểu gõ VNI, sửa lỗi nâng cao, gõ song ngữ Việt-Anh cân bằng, gõ tắt và thiết lập theo ứng dụng.</desc>
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <symbol id="check" viewBox="0 0 20 20">
      <rect x="0.75" y="0.75" width="18.5" height="18.5" rx="5" fill="#38bdf8" stroke="#7dd3fc" stroke-width="1.5"/>
      <path d="M5.3 10.2 8.4 13.2 14.8 6.8" fill="none" stroke="#07131b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="empty" viewBox="0 0 20 20">
      <rect x="1" y="1" width="18" height="18" rx="5" fill="#202327" stroke="#7b8492" stroke-width="1.5"/>
    </symbol>
    <symbol id="chevron" viewBox="0 0 12 8">
      <path d="m1 1 5 5 5-5" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <style>
      text { font-family: "Segoe UI", "Noto Sans", sans-serif; text-rendering: geometricPrecision; }
      .title { fill: #f8fafc; font-size: 19px; font-weight: 650; }
      .section { fill: #f8fafc; font-size: 18px; font-weight: 700; letter-spacing: .1px; }
      .card-title { fill: #f1f5f9; font-size: 16px; font-weight: 650; }
      .label { fill: #d7dce4; font-size: 14px; }
      .muted { fill: #929cab; font-size: 12px; }
      .button { fill: #eef2f7; font-size: 14px; font-weight: 520; }
      .select { fill: #f8fafc; font-size: 14px; }
      .accent { fill: #7dd3fc; }
    </style>
  </defs>

  <rect width="760" height="1240" fill="#0b0d10"/>
  <ellipse cx="626" cy="156" rx="170" ry="138" fill="#0ea5e9" opacity="0.10" filter="url(#softGlow)"/>
  <rect x="14" y="14" width="732" height="1212" rx="18" fill="#17191c" stroke="#353941" stroke-width="1.5" filter="url(#shadow)"/>

  <path d="M32 14h696a18 18 0 0 1 18 18v38H14V32a18 18 0 0 1 18-18Z" fill="#202226"/>
  <rect x="32" y="29" width="26" height="26" rx="7" fill="url(#logo)"/>
  <text x="45" y="48" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">N</text>
  <text x="70" y="48" class="title">Cấu hình Neokey</text>
  <path d="m711 34 12 12m0-12-12 12" stroke="#aab1bc" stroke-width="1.7" stroke-linecap="round"/>

  <g transform="translate(42 96)">
    <text x="0" y="0" class="section">Kiểu gõ</text>
    <rect x="0" y="18" width="212" height="46" rx="9" fill="#25282d" stroke="#555b66"/>
    <text x="106" y="47" text-anchor="middle" class="button">Telex</text>
    <rect x="224" y="18" width="238" height="46" rx="9" fill="#25282d" stroke="#555b66"/>
    <text x="343" y="47" text-anchor="middle" class="button">Simple Telex</text>
    <rect x="474" y="18" width="202" height="46" rx="9" fill="url(#selected)" stroke="#7dd3fc" stroke-opacity="0.55"/>
    <text x="575" y="47" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="650">VNI</text>

    <text x="0" y="104" class="section">Sửa lỗi và gõ song ngữ</text>

    <rect x="0" y="124" width="324" height="234" rx="14" fill="#202327" stroke="#343942"/>
    <text x="20" y="154" class="card-title">Sửa lỗi</text>
    <text x="20" y="186" class="label">Mức:</text>
    <rect x="80" y="166" width="186" height="38" rx="7" fill="#292d32" stroke="#59616d"/>
    <text x="96" y="190" class="select">Nâng cao</text>
    <use href="#chevron" x="244" y="181" width="12" height="8"/>
    <rect x="274" y="166" width="34" height="38" rx="7" fill="#292d32" stroke="#59616d"/>
    <text x="291" y="191" text-anchor="middle" class="button">?</text>
    <use href="#check" x="20" y="220" width="18" height="18"/>
    <text x="48" y="234" class="label">Backspace hoàn tác sửa/gõ tắt</text>
    <use href="#empty" x="20" y="258" width="18" height="18"/>
    <text x="48" y="272" class="label">Tách từ dính (Thử nghiệm)</text>
    <use href="#check" x="20" y="296" width="18" height="18"/>
    <text x="48" y="310" class="label">Tự viết hoa sau dấu chấm</text>

    <rect x="340" y="124" width="336" height="234" rx="14" fill="#17252c" stroke="#38bdf8" stroke-opacity="0.62" stroke-width="1.5"/>
    <rect x="358" y="140" width="112" height="24" rx="12" fill="#0c4a6e"/>
    <text x="414" y="157" text-anchor="middle" fill="#bae6fd" font-size="11" font-weight="700" letter-spacing=".5">SONG NGỮ</text>
    <text x="358" y="190" class="card-title">Gõ song ngữ Việt–Anh</text>
    <text x="358" y="222" class="label">Chế độ:</text>
    <rect x="430" y="202" width="224" height="38" rx="7" fill="#243039" stroke="#5b7280"/>
    <text x="446" y="226" class="select">Cân bằng</text>
    <use href="#chevron" x="630" y="217" width="12" height="8"/>
    <use href="#check" x="358" y="256" width="18" height="18"/>
    <text x="386" y="270" class="label">Bảo vệ URL, email và mã</text>
    <rect x="358" y="294" width="296" height="42" rx="8" fill="#12202a" stroke="#24495d"/>
    <text x="374" y="320" fill="#a5f3fc" font-size="13" font-family="Consolas, monospace">github viet61  →  github viết</text>

    <text x="0" y="402" class="section">Tiện ích</text>
    <rect x="0" y="422" width="676" height="154" rx="14" fill="#202327" stroke="#343942"/>
    <use href="#check" x="20" y="447" width="18" height="18"/>
    <text x="48" y="461" class="label">Bật tính năng gõ tắt</text>
    <rect x="488" y="440" width="166" height="42" rx="8" fill="#292d32" stroke="#69717d"/>
    <text x="571" y="466" text-anchor="middle" class="button">Bảng gõ tắt...</text>
    <use href="#empty" x="20" y="491" width="18" height="18"/>
    <text x="48" y="505" class="label">Bật file log để gỡ lỗi</text>
    <text x="20" y="548" class="label">Chế độ Direct inline/commit</text>
    <rect x="488" y="522" width="166" height="42" rx="8" fill="#292d32" stroke="#69717d"/>
    <text x="571" y="548" text-anchor="middle" class="button">Cấu hình...</text>

    <text x="0" y="620" class="section">Thiết lập theo ứng dụng</text>
    <rect x="0" y="640" width="676" height="130" rx="14" fill="#202327" stroke="#343942"/>
    <use href="#check" x="20" y="665" width="18" height="18"/>
    <text x="48" y="679" class="label">Dùng kiểu gõ riêng cho từng ứng dụng</text>
    <use href="#check" x="20" y="711" width="18" height="18"/>
    <text x="48" y="725" class="label">Tự nhớ kiểu gõ hoặc trạng thái tắt</text>
    <rect x="488" y="684" width="166" height="42" rx="8" fill="#292d32" stroke="#69717d"/>
    <text x="571" y="710" text-anchor="middle" class="button">Ứng dụng...</text>

    <text x="0" y="814" class="section">Phím tắt và ngôn ngữ</text>
    <rect x="0" y="834" width="676" height="128" rx="14" fill="#202327" stroke="#343942"/>
    <text x="20" y="866" class="label">Bật hoặc tắt Neokey</text>
    <rect x="284" y="846" width="166" height="38" rx="8" fill="#40454d" stroke="#78818d"/>
    <text x="367" y="870" text-anchor="middle" class="button">Ctrl + Shift</text>
    <rect x="462" y="846" width="192" height="38" rx="8" fill="#292d32" stroke="#69717d"/>
    <text x="558" y="870" text-anchor="middle" class="button">Alt + Z</text>
    <text x="20" y="918" class="label">Chế độ hiện tại</text>
    <rect x="284" y="898" width="166" height="38" rx="8" fill="url(#selected)" stroke="#7dd3fc" stroke-opacity="0.55"/>
    <text x="367" y="922" text-anchor="middle" fill="#fff" font-size="14" font-weight="650">Tiếng Việt</text>
    <rect x="462" y="898" width="192" height="38" rx="8" fill="#292d32" stroke="#69717d"/>
    <text x="558" y="922" text-anchor="middle" class="button">English</text>

    <text x="0" y="1006" class="section">Khởi động</text>
    <use href="#empty" x="20" y="1025" width="18" height="18"/>
    <text x="48" y="1039" class="label">Khởi động ứng dụng cấu hình cùng Windows</text>
    <text x="48" y="1065" class="muted">Chỉ khởi động ứng dụng cấu hình; bộ gõ hoạt động độc lập.</text>
  </g>

  <rect x="14" y="1178" width="732" height="48" rx="0" fill="#1d2024"/>
  <path d="M14 1178h732" stroke="#4b515b"/>
  <text x="42" y="1208" class="muted">Phiên bản: 0.1.10</text>
  <rect x="438" y="1190" width="86" height="30" rx="7" fill="#293039" stroke="#64707c"/>
  <text x="481" y="1210" text-anchor="middle" class="button">OK</text>
  <rect x="536" y="1190" width="86" height="30" rx="7" fill="#25282d" stroke="#555b66"/>
  <text x="579" y="1210" text-anchor="middle" class="button">Hủy bỏ</text>
  <rect x="634" y="1190" width="86" height="30" rx="7" fill="#25282d" stroke="#555b66"/>
  <text x="677" y="1210" text-anchor="middle" class="button">Áp dụng</text>
</svg>
